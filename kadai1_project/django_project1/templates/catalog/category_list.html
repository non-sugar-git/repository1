{% extends "base.html" %}
{% block content %}
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>カテゴリ一覧</title></head>
  <body>
    <h1>カテゴリ一覧</h1>
    <!-- TODO:
      1) base.html を継承する（extends / block content）
      2) object_list を for で回し、各カテゴリを詳細ページへリンク（url 'catalog:category_detail' c.slug）
      3) 0件時は「カテゴリは0件です。」（empty）
    -->
      <ul>
        {% for c in object_list %}
        <li>
          <a href="{% url 'catalog:category_detail' c.slug %}">
            {{ c.name }}
          </a>
        </li>
      {% empty %}
        <p>カテゴリは0件です。</p>
      {% endfor %}
    </ul>
  </body>
</html>
{% endblock %}
