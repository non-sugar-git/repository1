{% extends "base.html" %}
{% block content %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>カテゴリ詳細</title>
  </head>
  <body>
    <h1>{{ object.name }}</h1>
    <p>スラッグ: {{ object.slug }}</p>
    <p><small>作成日: {{ object.created_at }}</small></p>
  <!-- TODO: 一覧への戻りリンク（url 'catalog:category_list'） -->
    <p><a href="{% url 'catalog:category_list' %}">← カテゴリ一覧へ戻る</a></p>
  </body>
</html>
{% endblock %}
