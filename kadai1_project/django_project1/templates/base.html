<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>django_project1</title>
    <style>
      body{font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem;}
      nav a{margin-right: .75rem;}
      ul.messages{list-style:none;padding:0}
      ul.messages li{background:#eef6ff;border:1px solid #9cc2ff;padding:.4rem .6rem;border-radius:6px;margin:.25rem 0}
    </style>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/catalog/categories/">Categories</a>
      <a href="/catalog/entries/published/">Published</a>
      <a href="/catalog/entries/unpublished/">Unpublished</a>
      <a href="/catalog/entries/search/">Search</a>
    </nav>
    {% if messages %}
      <ul class="messages">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </body>
</html>
